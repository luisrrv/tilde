[build]
  command = "npm run build"
  publish = "dist"

# /admin is a client-rendered island on an otherwise static host.
# Client-side routing there needs an SPA fallback so deep links
# and refreshes don't 404. Every other path is a real static file
# Astro already generated, so this only ever catches /admin/*.
# Everything in /_astro/ has a content hash in its filename, so it can
# be cached forever -- the browser stops re-checking the stylesheet on
# every page view. HTML keeps Netlify's default (always revalidate) so
# publishes show up immediately.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
